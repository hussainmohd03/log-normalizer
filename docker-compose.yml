services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./log-normalizer-backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$VAR (escaped $) is expanded by the container shell at
      # runtime from env_file values — NOT by Compose at parse time.
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  # -- One-shot migration runner --------------------------------------
  # Runs `prisma migrate deploy` and exits. Backend services
  # `depends_on: migrate: condition: service_completed_successfully` so
  # they will not start until the schema is up to date.
  #
  # Reusing the backend image keeps the Prisma CLI version locked to
  # the same version the app was built against — no drift.
  migrate:
    build:
      context: ./log-normalizer-backend
      dockerfile: Dockerfile
    image: log-normalizer-backend:${IMAGE_TAG:-latest}
    command: ['npx', 'prisma', 'migrate', 'deploy']
    env_file:
      - ./log-normalizer-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: 'no'

  # -- SLM inference service (GPU required) --------------------------─
  # If your host has no NVIDIA GPU, comment out this service AND
  # `backend-worker.depends_on.slm` below, then run the SLM natively
  # against a remote GPU and point SLM_API at it. The rest of the
  # stack will come up cleanly.
  slm:
    build:
      context: ./log-normalizer-slm
      dockerfile: Dockerfile
    image: log-normalizer-slm:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./log-normalizer-slm/.env
    environment:
      # Container path override — non-secret, matches the volume mount.
      MODEL_PATH: ${MODEL_PATH:-/app/models}
    volumes:
      - ./log-normalizer-slm/models:/app/models:ro
      - slm_cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks: [internal]

  # -- NestJS HTTP process --------------------------------------------
  backend-http:
    build:
      context: ./log-normalizer-backend
      dockerfile: Dockerfile
    image: log-normalizer-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./log-normalizer-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    networks: [internal]

  # -- NestJS BullMQ worker ------------------------------------------─
  # Same image as backend-http, different CMD. Concurrency is pinned
  # to 1 inside the worker code (single GPU, single inference at a
  # time) — do NOT scale this service horizontally.
  backend-worker:
    image: log-normalizer-backend:${IMAGE_TAG:-latest}
    build:
      context: ./log-normalizer-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ['node', 'dist/src/worker']
    env_file:
      - ./log-normalizer-backend/.env
    environment:
      # Prevent the worker from racing the http process to create
      # the bootstrap admin on first start.
      BOOTSTRAP_ADMIN_EMAIL: ''
      BOOTSTRAP_ADMIN_PASSWORD: ''
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      slm:
        condition: service_healthy
    healthcheck:
      # Worker has no HTTP port — check the node process is running.
      test: ['CMD-SHELL', "pgrep -f 'dist/src/worker' > /dev/null"]
      interval: 15s
      timeout: 3s
      retries: 4
    networks: [internal]

  # -- React UI served by nginx --------------------------------------─
  # VITE_API_URL is a build-time arg baked into the bundle; nginx
  # does not read an env file at runtime, so no env_file: here.
  frontend:
    build:
      context: ./log-normalizer-ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    image: log-normalizer-ui:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      backend-http:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  slm_cache:

networks:
  internal:
    driver: bridge
