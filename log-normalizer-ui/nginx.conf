server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed assets — Vite emits unique filenames per build.
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  # SPA history fallback: any unmatched path serves index.html so
  # client-side routes survive hard refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Healthcheck endpoint nginx replies to without hitting disk.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
